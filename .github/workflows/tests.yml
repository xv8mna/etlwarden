name: tests

# For every change to main and every pull request: check the code with ruff, then run all tests on Windows.
# There's no lock file, so each run also uses the newest PySide6 and pytest that
# pyproject.toml allows, and a breaking release shows up here right away.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip list
      - name: Lint
        run: python -m ruff check etlwarden tests examples packaging
      - name: Test
        run: python -m pytest -ra
